name: Refresh amiibo list

# Rebuilds fetchamiibo/index.json every week so `fetchamiibo --update` picks up new dumps and names.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_index.py
      - run: python -m unittest discover -s tests
      - name: Commit if it changed
        run: |
          git diff --quiet fetchamiibo/index.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Refresh amiibo list"
          git push
