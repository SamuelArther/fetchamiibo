name: Import new dumps

# Every week: copy in amiibo dumps that the source repositories have added since (see SOURCES in
# tools/import_dumps.py), refresh names from AmiiboAPI, and commit. `fetchamiibo --update` then sees them.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/import_dumps.py
      - run: python -m unittest discover -s tests
      - name: Commit if anything changed
        run: |
          git add -A dumps fetchamiibo/index.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import new amiibo dumps"
          git push
