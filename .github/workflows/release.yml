name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: fetchamiibo-windows.exe
          - os: macos-latest
            asset: fetchamiibo-macos
          - os: ubuntu-latest
            asset: fetchamiibo-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --name fetchamiibo --paths . --add-data "fetchamiibo/index.json:fetchamiibo" tools/pyi_entry.py
      - name: Smoke test
        shell: bash
        run: |
          exe=dist/fetchamiibo
          [ -f dist/fetchamiibo.exe ] && exe=dist/fetchamiibo.exe
          "$exe" --version
          "$exe" --list | grep -q "Super Smash Bros."
          mv "$exe" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
